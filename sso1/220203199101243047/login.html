<script>
    (function () {
      var STORAGE_KEY = 'sso1_user';
      var USERNAME_KEY = 'sso1_username';
      var config = window.SSO1_CONFIG || {};
      var account = config.account || {};

function withTimestamp(url) {
  try {
    var target = new URL(url, window.location.href);
    target.searchParams.set('t', Date.now().toString());
    return target.toString();
  } catch (error) {
    return url;
  }
}

function ensureFreshTimestamp() {
  try {
    // Screenshot capture passes this flag because it must not race with
    // the normal page cache-busting navigation while resources load.
    if (new URL(window.location.href).searchParams.get('__screenshot') === '1') {
      return true;
    }
    var currentUrl = new URL(window.location.href);
    var rawTimestamp = (currentUrl.searchParams.get('t') || '').trim();
    var timestamp = Number(rawTimestamp);
    var isValidTimestamp = rawTimestamp !== '' && Number.isFinite(timestamp);
    if (isValidTimestamp && Math.abs(Date.now() - timestamp) <= 5000) {
      return true;
    }
    window.location.replace(withTimestamp(window.location.href));
    return false;
  } catch (error) {
    return true;
  }
}

      if (!ensureFreshTimestamp()) {
        return;
      }

      function isLocalPageLink(url) {
        try {
          var target = new URL(url, window.location.href);
          var pathname = target.pathname || '';
          if (!/[/][^/?#]+[.]html?$/i.test(pathname)) {
            return false;
          }
          if (target.protocol === 'file:' || window.location.protocol === 'file:') {
            return true;
          }
          return target.origin === window.location.origin;
        } catch (error) {
          return false;
        }
      }

      function decorateLinks() {
        var anchors = document.querySelectorAll('a[href]');
        Array.prototype.forEach.call(anchors, function (anchor) {
          var href = String(anchor.getAttribute('href') || '').trim();
          if (!isLocalPageLink(href)) {
            return;
          }
          anchor.setAttribute('href', withTimestamp(href));
        });
      }

      function navigate(url) {
        window.location.href = withTimestamp(url);
      }

      function showError(message) {
        if (window.Swal && typeof window.Swal.fire === 'function') {
          window.Swal.fire({ icon: 'error', text: message, confirmButtonText: '确定' });
          return;
        }
        window.alert(message);
      }

      function doLogin(event) {
        if (event && typeof event.preventDefault === 'function') {
          event.preventDefault();
        }
        var usernameEl = document.getElementById('idNum');
        var passwordEl = document.getElementById('password');
        var username = String((usernameEl && usernameEl.value) || '').trim().toUpperCase();
        var password = String((passwordEl && passwordEl.value) || '');
        var expectedUsername = String(account.username || '').trim().toUpperCase();
        var expectedPassword = String(account.password || '');

        if (!username) {
          showError('请输入账号');
          usernameEl && usernameEl.focus();
          return false;
        }
        if (!password) {
          showError('请输入密码');
          passwordEl && passwordEl.focus();
          return false;
        }
        if (username !== expectedUsername || password !== expectedPassword) {
          showError('账号或密码错误');
          return false;
        }

        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          username: account.username || username,
          display_name: account.display_name || account.username || username,
          profile: config.profile || {},
          certificate: config.certificate || {}
        }));
        localStorage.setItem(USERNAME_KEY, account.username || username);
        navigate('./index.html');
        return false;
      }

      var button = document.getElementById('btnvalid');
      if (button) {
        button.addEventListener('click', doLogin);
      }
      var passwordInput = document.getElementById('password');
      if (passwordInput) {
        passwordInput.addEventListener('keydown', function (event) {
          if (event.key === 'Enter') {
            doLogin(event);
          }
        });
      }

      var storedUsername = localStorage.getItem(USERNAME_KEY) || localStorage.account || '';
      var usernameInput = document.getElementById('idNum');
      if (usernameInput && storedUsername) {
        usernameInput.value = storedUsername;
      }

      decorateLinks();

      var toggle = document.querySelector('.passwordRight');
      var eyeImage = document.querySelector('.passwordRight img');
      if (toggle && passwordInput) {
        toggle.addEventListener('click', function () {
          var hidden = passwordInput.getAttribute('type') !== 'text';
          passwordInput.setAttribute('type', hidden ? 'text' : 'password');
          if (eyeImage) {
            eyeImage.setAttribute('src', hidden ? './access/images/login-open-eyes.jpg' : './access/images/login-close-eyes.jpg');
          }
        });
      }

      window.login = doLogin;
    })();
    </script>
