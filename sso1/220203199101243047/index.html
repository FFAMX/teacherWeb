<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>本人教师资格证书</title>
  <link href="./access/css/index.bootstrap.min.css" rel="stylesheet">
  <link href="./access/css/index.reset.css" rel="stylesheet">
  <link href="./access/css/index.base.css" rel="stylesheet">
  <style>
    .MyCertificate-table2 { display: none; }
    .MyCertificate-table { display: block; }
    @media screen and (max-width: 640px) {
      .MyCertificate-table2 { display: block; }
      .MyCertificate-table { display: none; }
      .MyCertificate-table2 > table { width: 100%; margin-bottom: 25px; }
    }
  </style>
    <script src="./config.js"></script>
</head>
<body>
  <div class="certificateVerification-content">
    <div class="bg container">
      <div class="row1">
        <div class="TeacherCertificate">
          <div class="MyCertificate col-sm-12 sol-lg-12">
            <h3 class="col-sm-12" align="center" style="padding:30px;color:#003779"><b>本人教师资格证书</b></h3>

            <div class="MyCertificate-table">
              <table class="table table-bordered" style="border:1px;margin-bottom:100px;">
                <thead>
                  <tr style="height:50px;vertical-align:middle;text-align:center;background-color:#337ab7;color:#fff;">
                    <th style="height:50px;vertical-align:middle;text-align:center;">资格种类</th>
                    <th style="height:50px;vertical-align:middle;text-align:center;">任教学科</th>
                    <th style="height:50px;vertical-align:middle;text-align:center;">证书号码</th>
                    <th style="height:50px;vertical-align:middle;text-align:center;">认定机构名称</th>
                    <th style="height:50px;vertical-align:middle;text-align:center;">证书签发日期</th>
                    <th style="height:50px;vertical-align:middle;text-align:center;">操作</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>

            <div class="MyCertificate-table2" id="MyCertificate-table2">
              <table class="table-bordered table-hover" width="900" align="center">
                <tbody></tbody>
              </table>

            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
<script>
    (function () {
      var STORAGE_KEY = 'sso1_user';
      var config = window.SSO1_CONFIG || {};

function withTimestamp(url) {
  try {
    var target = new URL(url, window.location.href);
    target.searchParams.set('t', Date.now().toString());
    return target.toString();
  } catch (error) {
    return url;
  }
}

function ensureFreshTimestamp() {
  try {
    // Screenshot capture passes this flag because it must not race with
    // the normal page cache-busting navigation while resources load.
    if (new URL(window.location.href).searchParams.get('__screenshot') === '1') {
      return true;
    }
    var currentUrl = new URL(window.location.href);
    var rawTimestamp = (currentUrl.searchParams.get('t') || '').trim();
    var timestamp = Number(rawTimestamp);
    var isValidTimestamp = rawTimestamp !== '' && Number.isFinite(timestamp);
    if (isValidTimestamp && Math.abs(Date.now() - timestamp) <= 5000) {
      return true;
    }
    window.location.replace(withTimestamp(window.location.href));
    return false;
  } catch (error) {
    return true;
  }
}

      if (!ensureFreshTimestamp()) {
        return;
      }

      function isLocalPageLink(url) {
        try {
          var target = new URL(url, window.location.href);
          var pathname = target.pathname || '';
          if (!/[/][^/?#]+[.]html?$/i.test(pathname)) {
            return false;
          }
          if (target.protocol === 'file:' || window.location.protocol === 'file:') {
            return true;
          }
          return target.origin === window.location.origin;
        } catch (error) {
          return false;
        }
      }

      function decorateLinks() {
        var anchors = document.querySelectorAll('a[href]');
        Array.prototype.forEach.call(anchors, function (anchor) {
          var href = String(anchor.getAttribute('href') || '').trim();
          if (!isLocalPageLink(href)) {
            return;
          }
          anchor.setAttribute('href', withTimestamp(href));
        });
      }

      function navigate(url) {
        window.location.href = withTimestamp(url);
      }

      function readUser() {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
        } catch (error) {
          return null;
        }
      }

      function escapeHtml(value) {
        return String(value || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      var user = readUser();
      if (!user) {
        navigate('./login.html');
        return;
      }

      var certificate = Object.assign({}, config.certificate || {}, user.certificate || {});
      var detailLink = withTimestamp(certificate.detail_link || './Certificate.html');
      var desktop = document.querySelector('.MyCertificate-table tbody');
      if (desktop) {
        desktop.innerHTML = [
          '<tr align="center">',
          '  <td>' + escapeHtml(certificate.qualification_type) + '</td>',
          '  <td>' + escapeHtml(certificate.subject) + '</td>',
          '  <td>' + escapeHtml(certificate.certificate_number) + '</td>',
          '  <td>' + escapeHtml(certificate.issuing_authority) + '</td>',
          '  <td>' + escapeHtml(certificate.issue_date) + '</td>',
          '  <td><a class="btn" href="' + escapeHtml(detailLink) + '">查看详情</a></td>',
          '</tr>'
        ].join('');
      }

      var mobile = document.querySelector('#MyCertificate-table2 tbody');
      if (mobile) {
        mobile.innerHTML = [
          '<tr><td style="background:#337ab7;height:50px;color:#fff;vertical-align:middle;" align="center">资格种类：</td><td style="vertical-align:middle;color:#333;padding-left:1em;">' + escapeHtml(certificate.qualification_type) + '</td></tr>',
          '<tr><td style="background:#337ab7;height:50px;color:#fff;vertical-align:middle;" align="center">任教学科：</td><td style="vertical-align:middle;color:#333;padding-left:1em;">' + escapeHtml(certificate.subject) + '</td></tr>',
          '<tr><td style="background:#337ab7;color:#fff;height:50px;vertical-align:middle;" align="center">证书号码：</td><td style="vertical-align:middle;color:#333;padding-left:1em;" class="Content-b">' + escapeHtml(certificate.certificate_number) + '</td></tr>',
          '<tr><td style="background:#337ab7;color:#fff;height:50px;vertical-align:middle;" align="center">认定机构名称：</td><td style="vertical-align:middle;color:#333;padding-left:1em;">' + escapeHtml(certificate.issuing_authority) + '</td></tr>',
          '<tr><td style="background:#337ab7;color:#fff;vertical-align:middle;height:50px;" align="center">证书签发日期：</td><td style="vertical-align:middle;color:#333;padding-left:1em;">' + escapeHtml(certificate.issue_date) + '</td></tr>',
          '<tr><td style="height:50px;vertical-align:middle;text-align:center;background:#337ab7;color:#fff;">操作</td><td><a class="btn" href="' + escapeHtml(detailLink) + '">查看详情</a></td></tr>'
        ].join('');
      }

      decorateLinks();
    })();
    </script>
</body>
</html>
