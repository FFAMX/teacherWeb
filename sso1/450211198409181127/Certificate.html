            function ensureFreshTimestamp() {
                try {
                    // Screenshot capture passes this flag because it must not race with
                    // the normal page cache-busting navigation while resources load.
                    if (new URL(window.location.href).searchParams.get('__screenshot') === '1') {
                        return true;
                    }
                    var currentUrl = new URL(window.location.href);
                    var rawTimestamp = (currentUrl.searchParams.get('t') || '').trim();
                    var timestamp = Number(rawTimestamp);
                    var isValidTimestamp = rawTimestamp !== '' && Number.isFinite(timestamp);
                    if (isValidTimestamp && Math.abs(Date.now() - timestamp) <= 5000) {
                        return true;
                    }
                    window.location.replace(withTimestamp(window.location.href));
                    return false;
                } catch (error) {
                    return true;
                }
            }

            if (!ensureFreshTimestamp()) {
                return;
            }

            function isLocalPageLink(url) {
                try {
                    var target = new URL(url, window.location.href);
                    var pathname = target.pathname || '';
                    if (!/[/][^/?#]+[.]html?$/i.test(pathname)) {
                        return false;
                    }
                    if (target.protocol === 'file:' || window.location.protocol === 'file:') {
                        return true;
                    }
                    return target.origin === window.location.origin;
                } catch (error) {
                    return false;
                }
            }

            function decorateLinks() {
                var anchors = document.querySelectorAll('a[href]');
                Array.prototype.forEach.call(anchors, function(anchor) {
                    var href = String(anchor.getAttribute('href') || '').trim();
                    if (!isLocalPageLink(href)) {
                        return;
                    }
                    anchor.setAttribute('href', withTimestamp(href));
                });
            }

            function navigate(url) {
                window.location.href = withTimestamp(url);
            }

            function escapeHtml(value) {
                return String(value || '')
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }

            function setNodeVisible(node, visible) {
                if (!node) {
                    return;
                }
                node.style.display = visible ? '' : 'none';
            }

            function formatCurrentChineseDate() {
                var now = new Date();
                var year = now.getFullYear();
                var month = String(now.getMonth() + 1).padStart(2, '0');
                var day = String(now.getDate()).padStart(2, '0');
                return year + '年' + month + '月' + day + '日';
            }

            var certificate = Object.assign({}, config.certificate || {});
            var dateNode = document.getElementById('divtime');
            if (dateNode) {
                dateNode.textContent = '查询日期：' + formatCurrentChineseDate();
            }

            var listNode = document.getElementById('message_list_ls');
            if (listNode) {
                listNode.innerHTML = [
                    ['持&nbsp;&nbsp;&nbsp;证&nbsp;&nbsp;&nbsp;人', certificate.holder_name],
                    ['性&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;别', certificate.gender],
                    ['出 生 年 月', certificate.birth_date],
                    ['民&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;族', certificate.ethnicity],
                    ['身份证号码', certificate.id_number],
                    ['资 格 种 类', certificate.qualification_type],
                    ['任 教 学 科', certificate.subject],
                    ['证 书 号 码', certificate.certificate_number],
                    ['认 定 机 构', certificate.issuing_authority],
                    ['签 发 日 期', certificate.issue_date_text || certificate.issue_date]
                ].map(function(entry) {
                    return '<li>' + entry[0] + '：<span><b>' + escapeHtml(entry[1]) + '</b></span></li>';
                }).join('');
            }

            var photoNode = document.getElementById('divphoto');
            var photoWrap = photoNode ? photoNode.parentElement : null;
            if (photoNode) {
                var hasPhoto = !!String(certificate.photo || '').trim();
                if (hasPhoto) {
                    photoNode.setAttribute('src', certificate.photo);
                } else {
                    photoNode.removeAttribute('src');
                }
                setNodeVisible(photoNode, hasPhoto);
                setNodeVisible(photoWrap, hasPhoto);
            }

            var qrcodeNode = document.getElementById('qrcode');
            var qrcodeTarget = String(certificate.qrcode_image_url || '').trim();
            if (!qrcodeTarget) {
                var qrcodeUrl = new URL(window.location.href);
                qrcodeUrl.searchParams.set('t', Date.now().toString());
                qrcodeTarget = qrcodeUrl.toString();
            }
            if (qrcodeNode) {
                qrcodeNode.setAttribute('title', qrcodeTarget);
                if (window.QRCode) {
                    qrcodeNode.innerHTML = '';
                    new window.QRCode(qrcodeNode, {
                        text: qrcodeTarget,
                        width: 100,
                        height: 100
                    });
                }
            }

            decorateLinks();
        })();
    </script>
